<div class="recovery-screen">
  <div class="cempa-card recovery-card">
    <div class="logo-area">
      <img src="assets/cempa_horizontal.png" alt="CEMPA Cerrado" height="40" />
    </div>

    <app-progress-stepper
      [steps]="steps"
      [currentStep]="currentStep - 1">
    </app-progress-stepper>

    <app-step1-email
      *ngIf="currentStep === 1"
      (next)="goToStep(2)">
    </app-step1-email>

    <app-step2-code
      *ngIf="currentStep === 2"
      (next)="goToStep(3)"
      (back)="goToStep(1)">
    </app-step2-code>

    <app-step3-reset
      *ngIf="currentStep === 3">
    </app-step3-reset>
  </div>
</div>

# ==============================================================================
# CONFIGURA��ES GERAIS / DESENVOLVIMENTO
# ==============================================================================
# --- HTTP & Dev Services ---
%dev.quarkus.http.port=8002
%dev.quarkus.devservices.enabled=true

# --- Banco de Dados (Dev Services / Container Autom�tico) ---
%dev.quarkus.datasource.devservices.image-name=postgres:16
%dev.quarkus.datasource.devservices.db-name=sigedam
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=postgres_user
%dev.quarkus.datasource.password=postgres_password

# --- Hibernate (Destrutivo - APENAS DEV) ---
%dev.quarkus.hibernate-orm.database.generation=update
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.log.category."org.hibernate.SQL".level=DEBUG

# --- Seguran�a (JWT) ---
%dev.mp.jwt.verify.publickey.location=classpath:public.pem
%dev.smallrye.jwt.sign.key.location=classpath:privateKey-pkcs8.pem
%dev.mp.jwt.verify.issuer=org.ufg.api
%dev.quarkus.native.resources.includes=public.pem

# --- CORS (localhost: localhost e 127.0.0.1 são origens diferentes no browser) ---
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:4200,http://127.0.0.1:4200,http://[::1]:4200,http://localhost:9090,http://127.0.0.1:9090,http://localhost,http://127.0.0.1,http://localhost:8080,http://127.0.0.1:8080
%dev.quarkus.http.cors.access-control-allow-credentials=true
%dev.quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with, priority
%dev.quarkus.http.cors.methods=GET, PUT, POST, DELETE, OPTIONS, PATCH

# --- Logs Detalhados (Debug) ---
%dev.quarkus.log.category."com.fasterxml.jackson".level=DEBUG
%dev.quarkus.log.category."org.hibernate.validator".level=DEBUG
%dev.quarkus.log.category."org.jboss.resteasy".level=DEBUG

# --- Redis (Dev Services — container automático) ---
%dev.quarkus.redis.devservices.enabled=true
%dev.quarkus.redis.devservices.image-name=redis:7-alpine

# --- Mailer (modo mock em dev: não envia e-mail de verdade) ---
%dev.quarkus.mailer.mock=true

# ==============================================================================
# CONFIGURA��ES GERAIS / PRODU��O
# ==============================================================================

#%prod.quarkus.flyway.migrate-at-start=true
#%prod.quarkus.flyway.baseline-on-migrate=true
# Define que � Postgres (vale para todos os ambientes)
quarkus.datasource.db-kind=postgresql

# Origens CORS padrao do perfil prod (ver %prod.quarkus.http.cors.origins). Sobrescreva com QUARKUS_HTTP_CORS_ORIGINS=url1,url2
cors.allow.list=http://localhost:4200,http://127.0.0.1:4200,http://[::1]:4200,http://localhost:8080,http://localhost,http://127.0.0.1,http://200.137.215.94,http://200.137.215.94:4200,http://200.137.215.94:8080,http://200.137.215.94:8002,https://200.137.215.94,https://200.137.215.94:4200,https://200.137.215.94:8080,https://localhost:4200

# Em produ��o, usamos validate para n�o quebrar o banco
%prod.quarkus.hibernate-orm.database.generation=validate

# Em produ��o, usamos vari�veis de ambiente (injetadas pelo Docker)
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://db:5432/sigedam}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD}

%prod.quarkus.http.port=8002
%prod.quarkus.http.cors.enabled=true
# Origens permitidas (lista em propriedade separada: não dá para usar http:// em ${VAR:default} por causa dos ":").
%prod.quarkus.http.cors.origins=${QUARKUS_HTTP_CORS_ORIGINS:${cors.allow.list}}
%prod.quarkus.http.cors.access-control-allow-credentials=false
%prod.quarkus.http.cors.methods=GET, PUT, POST, DELETE, OPTIONS, PATCH
%prod.quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with, priority

# ==============================================================================
# CONFIGURA��O DE PRODU��O (%prod) - SEGURAN�A JWT
# ==============================================================================

%prod.mp.jwt.verify.issuer=org.ufg.api

%prod.mp.jwt.verify.publickey.location=classpath:public.pem
%prod.quarkus.native.resources.includes=public.pem
%prod.smallrye.jwt.sign.key.location=classpath:privateKey-pkcs8.pem

# --- Redis ---
%prod.quarkus.redis.hosts=redis://redis:6379

# --- Mailer (SMTP) ---
%prod.quarkus.mailer.mock=${QUARKUS_MAILER_MOCK:false}
%prod.quarkus.mailer.host=${MAIL_HOST:localhost}
%prod.quarkus.mailer.port=${MAIL_PORT:587}
%prod.quarkus.mailer.start-tls=REQUIRED
%prod.quarkus.mailer.username=${MAIL_USERNAME:unused}
%prod.quarkus.mailer.password=${MAIL_PASSWORD:unused}
%prod.quarkus.mailer.from=${MAIL_FROM:noreply@sigedam.ufg.br}
